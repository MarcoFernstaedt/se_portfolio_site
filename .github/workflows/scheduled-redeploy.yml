name: Scheduled portfolio redeploy

on:
  schedule:
    - cron: '20 15 * * 2,4'
    - cron: '50 18 * * 3'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL is not configured; skipping scheduled redeploy."
            exit 0
          fi

          curl --fail --show-error --silent --retry 2 --request POST "$DEPLOY_HOOK_URL"
